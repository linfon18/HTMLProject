<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空气动力学数字风洞 - Aerodynamic Wind Tunnel</title>
<style>
  :root {
    --bg-color: #030712;
    --accent-blue: #38bdf8;
    --accent-red: #ef4444;
    --accent-green: #22c55e;
    --glass-bg: rgba(15, 23, 42, 0.78);
    --glass-border: rgba(56, 189, 248, 0.2);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
  }

  body {
    background-color: var(--bg-color);
    color: #f8fafc;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  #viewport {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: default;
  }

  /* 顶部科幻标头 */
  .header-card {
    position: absolute;
    top: 24px;
    left: 28px;
    z-index: 10;
    pointer-events: none;
  }

  .header-card h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    text-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
  }

  .header-card .sub {
    font-size: 0.85rem;
    color: #94a3b8;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 10px #38bdf8;
    animation: windPulse 1.5s infinite ease-in-out;
  }

  @keyframes windPulse {
    0%, 100% { opacity: 0.3; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* 右上角空气动力学仪表 */
  .telemetry-card {
    position: absolute;
    top: 24px;
    right: 28px;
    z-index: 10;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 16px 20px;
    min-width: 270px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    font-family: 'Courier New', monospace;
  }

  .telemetry-title {
    font-size: 0.75rem;
    color: var(--accent-blue);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    border-bottom: 1px solid rgba(56, 189, 248, 0.2);
    padding-bottom: 5px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }

  .tele-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    margin-bottom: 5px;
  }

  .tele-row .lbl { color: #64748b; }
  .tele-row .val { color: #f8fafc; font-weight: 600; }
  .tele-row .val.stall { color: var(--accent-red); animation: blink 0.6s infinite alternate; }

  @keyframes blink {
    from { opacity: 1; }
    to { opacity: 0.3; }
  }

  /* 底部风洞控制台 */
  .dock {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 14px 22px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    gap: 18px;
    max-width: 94vw;
    flex-wrap: wrap;
    justify-content: center;
  }

  .ctrl-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .ctrl-item label {
    font-size: 0.7rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
  }

  .ctrl-item label span {
    color: var(--accent-blue);
    font-family: monospace;
  }

  .ctrl-item input[type="range"] {
    -webkit-appearance: none;
    width: 120px;
    height: 4px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 2px;
    outline: none;
  }

  .ctrl-item input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent-blue);
    cursor: pointer;
    box-shadow: 0 0 10px var(--accent-blue);
    transition: transform 0.1s;
  }

  .ctrl-item input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.3);
  }

  .btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover {
    background: rgba(56, 189, 248, 0.2);
    border-color: var(--accent-blue);
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    transform: translateY(-2px);
  }

  .btn.active {
    background: var(--accent-blue);
    color: #030712;
    border-color: var(--accent-blue);
    box-shadow: 0 0 15px var(--accent-blue);
  }

  /* 气动构型快捷选择栏 */
  .airfoil-bar {
    position: absolute;
    top: 90px;
    left: 28px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .airfoil-btn {
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #cbd5e1;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-width: 170px;
  }

  .airfoil-btn:hover, .airfoil-btn.active {
    background: rgba(56, 189, 248, 0.25);
    border-color: var(--accent-blue);
    color: #fff;
    transform: translateX(4px);
  }

  .hint-tip {
    position: absolute;
    bottom: 24px;
    left: 28px;
    z-index: 10;
    pointer-events: none;
    font-size: 0.75rem;
    color: #64748b;
    line-height: 1.6;
  }
</style>
</head>
<body>

<canvas id="viewport"></canvas>

<div class="header-card">
  <h1>AERODYNAMIC WIND TUNNEL</h1>
  <div class="sub">
    <div class="pulse-dot"></div>
    <span>超临界流线 · 翼型压力差 · 边界层湍流失速</span>
  </div>
</div>

<div class="airfoil-bar" id="airfoil-list">
  <!-- 气动构型列表由 JS 生成 -->
</div>

<div class="telemetry-card">
  <div class="telemetry-title">
    <span>空气动力遥测 (AERO DATA)</span>
    <span id="fps-val">60 FPS</span>
  </div>
  <div class="tele-row">
    <span class="lbl">气动外形:</span>
    <span class="val" id="tele-airfoil">NACA 2412</span>
  </div>
  <div class="tele-row">
    <span class="lbl">迎角 (AoA):</span>
    <span class="val" id="tele-aoa">8.0°</span>
  </div>
  <div class="tele-row">
    <span class="lbl">升力系数 (CL):</span>
    <span class="val" id="tele-cl">0.82</span>
  </div>
  <div class="tele-row">
    <span class="lbl">阻力系数 (CD):</span>
    <span class="val" id="tele-cd">0.065</span>
  </div>
  <div class="tele-row">
    <span class="lbl">升阻比 (L/D):</span>
    <span class="val" id="tele-lod">12.6</span>
  </div>
  <div class="tele-row">
    <span class="lbl">流态判定:</span>
    <span class="val" id="tele-status">正常层流</span>
  </div>
</div>

<div class="hint-tip">
  ✈️ 拖拽中央翼型: 快速调整迎角 (Angle of Attack)<br>
  💨 鼠标滑过风洞: 注入自定义彩色流动烟雾<br>
  ⚠️ 迎角超过 ~16° 将触发真实空气动力学失速 (Stall)
</div>

<div class="dock">
  <div class="ctrl-item">
    <label>迎角 AoA <span id="val-aoa">8°</span></label>
    <input type="range" id="param-aoa" min="-20" max="30" step="1" value="8">
  </div>
  <div class="ctrl-item">
    <label>风洞风速 Velocity <span id="val-speed">1.2</span></label>
    <input type="range" id="param-speed" min="0.4" max="2.5" step="0.1" value="1.2">
  </div>
  <div class="ctrl-item">
    <label>烟流密度 Density <span id="val-density">1800</span></label>
    <input type="range" id="param-density" min="800" max="3200" step="200" value="1800">
  </div>

  <button class="btn" id="btn-vector">📐 气动力矢量: 开</button>
  <button class="btn" id="btn-pressure">🌈 伯努利压强场: 开</button>
  <button class="btn" id="btn-color">🎨 烟气色谱: 极光</button>
  <button class="btn" id="btn-reset">🔄 重置姿态</button>
</div>

<script>
/**
 * 现代高保真空气动力学风洞模拟器
 * 核心模型：
 * 1. NACA 4位数翼型几何发生器与多边形 SDF（有向距离场）
 * 2. 局部流场基于势流理论 + 边界层黏性剪切 + 翼上失速分离涡街（Vortex Shedding）
 * 3. 伯努利定律：P + 1/2 * rho * v^2 = C，上表面流速加速导致负压，下表面滞止高压
 * 4. 气动力积分：升力 L、诱导阻力 D、俯仰力矩 M
 */

const canvas = document.getElementById('viewport');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// 气动几何预设
const AIRFOILS = [
  { id: 'naca2412', name: 'NACA 2412 (经典客机翼)', type: 'naca', m: 0.02, p: 0.4, t: 0.12 },
  { id: 'naca0012', name: 'NACA 0012 (对称特技翼)', type: 'naca', m: 0.0, p: 0.0, t: 0.12 },
  { id: 'naca4415', name: 'NACA 4415 (高升力厚翼)', type: 'naca', m: 0.04, p: 0.4, t: 0.15 },
  { id: 'cylinder', name: '圆柱体 (卡门涡街)', type: 'circle', r: 0.16 },
  { id: 'flatplate', name: '薄平板 (超音速机翼)', type: 'plate', t: 0.02 },
  { id: 'downforce', name: 'F1 倒置翼 (地面下压力)', type: 'naca', m: -0.06, p: 0.4, t: 0.14 }
];

let currentAirfoil = AIRFOILS[0];

// 状态参数
const state = {
  aoa: 8 * Math.PI / 180, // 弧度
  windSpeed: 1.2,
  showVectors: true,
  showPressure: true,
  colorScheme: 'aurora', // 'aurora', 'cyan', 'thermal', 'monochrome'
  isDraggingWing: false,
  smokeCount: 1800,
  userMouse: { x: -100, y: -100, active: false }
};

// 翼型位置与几何尺度
const wingScale = 220; // 弦长像素尺寸
function getWingCenter() {
  return { x: width * 0.42, y: height * 0.5 };
}

// 初始化构型列表
const listElem = document.getElementById('airfoil-list');
AIRFOILS.forEach((af, idx) => {
  const btn = document.createElement('div');
  btn.className = 'airfoil-btn' + (idx === 0 ? ' active' : '');
  btn.innerHTML = `<span>${af.name}</span>`;
  btn.onclick = () => {
    document.querySelectorAll('.airfoil-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentAirfoil = af;
    document.getElementById('tele-airfoil').textContent = af.id.toUpperCase();
    resetSmoke();
  };
  listElem.appendChild(btn);
});

// 计算 NACA 4 位数外轮廓点集 (归一化弦长 [0, 1])
function generateNacaPoints(m, p, t, numPoints = 80) {
  const points = [];
  const upper = [];
  const lower = [];

  for (let i = 0; i <= numPoints; i++) {
    const beta = (i / numPoints) * Math.PI;
    const x = 0.5 * (1 - Math.cos(beta)); // 余弦间距加密前缘点

    // 厚度分布 yt
    const yt = 5 * t * (
      0.2969 * Math.sqrt(Math.max(0, x)) -
      0.1260 * x -
      0.3516 * x * x +
      0.2843 * x * x * x -
      0.1015 * x * x * x * x
    );

    // 中弧线 yc 与斜率 theta
    let yc = 0;
    let dyc_dx = 0;

    if (p > 0.001) {
      if (x < p) {
        yc = (m / (p * p)) * (2 * p * x - x * x);
        dyc_dx = (2 * m / (p * p)) * (p - x);
      } else {
        yc = (m / ((1 - p) * (1 - p))) * ((1 - 2 * p) + 2 * p * x - x * x);
        dyc_dx = (2 * m / ((1 - p) * (1 - p))) * (p - x);
      }
    }

    const theta = Math.atan(dyc_dx);
    const xu = x - yt * Math.sin(theta);
    const yu = yc + yt * Math.cos(theta);
    const xl = x + yt * Math.sin(theta);
    const yl = yc - yt * Math.cos(theta);

    upper.push({ x: xu - 0.25, y: -yu }); // 以 1/4 弦长为气动旋转焦点
    lower.push({ x: xl - 0.25, y: -yl });
  }

  // 顺时针闭合
  for (let i = 0; i < upper.length; i++) points.push(upper[i]);
  for (let i = lower.length - 1; i >= 0; i--) points.push(lower[i]);

  return points;
}

// 判断点是否在当前翼型内部（点多边形测试）
function isPointInsideAirfoil(px, py) {
  const center = getWingCenter();
  const relX = px - center.x;
  const relY = py - center.y;

  // 逆旋转迎角
  const cosA = Math.cos(-state.aoa);
  const sinA = Math.sin(-state.aoa);
  const localX = (relX * cosA - relY * sinA) / wingScale;
  const localY = (relX * sinA + relY * cosA) / wingScale;

  if (currentAirfoil.type === 'circle') {
    return (localX * localX + localY * localY) < (currentAirfoil.r * currentAirfoil.r);
  }

  if (currentAirfoil.type === 'plate') {
    return (localX >= -0.25 && localX <= 0.75 && Math.abs(localY) <= currentAirfoil.t);
  }

  // NACA
  const points = generateNacaPoints(currentAirfoil.m, currentAirfoil.p, currentAirfoil.t, 40);
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    const xi = points[i].x, yi = points[i].y;
    const xj = points[j].x, yj = points[j].y;
    const intersect = ((yi > localY) !== (yj > localY)) &&
        (localX < (xj - xi) * (localY - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// 局域速度矢量场计算 (vx, vy)
function getFlowVelocity(px, py) {
  const center = getWingCenter();
  const relX = (px - center.x) / wingScale;
  const relY = (py - center.y) / wingScale;

  // 基础水平风速
  let vx = state.windSpeed * 3.5;
  let vy = 0;

  // 翼型引起的流线绕流扰动 (偶极子 + 涡环诱导模型)
  const distSq = relX * relX + relY * relY + 0.04;
  const dist = Math.sqrt(distSq);

  const aoaDeg = state.aoa * 180 / Math.PI;
  const isStalled = Math.abs(aoaDeg) > 15.5;

  // 升力环量 Gamma = pi * c * V * sin(aoa)
  let gamma = Math.PI * 0.8 * state.windSpeed * Math.sin(state.aoa);
  if (isStalled) {
    gamma *= 0.35; // 失速后升力环量崩塌
  }

  // 涡诱导速度
  const indVx = -gamma * relY / (2 * Math.PI * distSq);
  const indVy = gamma * relX / (2 * Math.PI * distSq);

  vx += indVx * 2.8;
  vy += indVy * 2.8;

  // 后缘分离脱体尾迹 (失速涡街)
  if (isStalled && relX > 0.1 && Math.abs(relY) < 0.6) {
    const time = performance.now() * 0.006;
    const vortex = Math.sin(relX * 12 - time) * 1.5;
    vy += vortex * (relX);
    vx *= 0.65; // 尾流失速低速区
  }

  // 表面边界层阻滞
  if (dist < 0.35) {
    vx *= 0.8;
  }

  return { vx, vy, speed: Math.hypot(vx, vy) };
}

// 示踪流线烟气粒子系统
let smokeParticles = [];
function resetSmoke() {
  smokeParticles = [];
  for (let i = 0; i < state.smokeCount; i++) {
    smokeParticles.push({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: 0,
      vy: 0,
      life: Math.random(),
      streamId: Math.floor(Math.random() * 8)
    });
  }
}
resetSmoke();

// 物理与粒子更新
let lastTime = performance.now();
let frames = 0;
let lastFpsTime = performance.now();

function updateSimulation(dt) {
  dt = Math.min(dt, 0.05);

  const center = getWingCenter();

  // 空气动力学系数计算
  const aoaDeg = state.aoa * 180 / Math.PI;
  const isStalled = Math.abs(aoaDeg) > 15.5;

  let cl = 2 * Math.PI * (state.aoa + (currentAirfoil.m ? currentAirfoil.m * 2 : 0));
  let cd = 0.015 + 1.2 * Math.sin(state.aoa) * Math.sin(state.aoa);

  if (isStalled) {
    // 失速剧烈掉升力，阻力暴涨
    cl = Math.sign(aoaDeg) * (0.45 + Math.random() * 0.08);
    cd = 0.32 + Math.abs(Math.sin(state.aoa)) * 0.9;
  }

  const lod = Math.abs(cd) > 0.001 ? Math.abs(cl / cd).toFixed(1) : '∞';

  // 遥测卡片刷新
  document.getElementById('tele-aoa').textContent = aoaDeg.toFixed(1) + '°';
  document.getElementById('tele-cl').textContent = cl.toFixed(2);
  document.getElementById('tele-cd').textContent = cd.toFixed(3);
  document.getElementById('tele-lod').textContent = lod;

  const statusElem = document.getElementById('tele-status');
  if (isStalled) {
    statusElem.textContent = '⚠️ 气动失速 (STALL)';
    statusElem.className = 'val stall';
  } else {
    statusElem.textContent = '正常层流 (Laminar)';
    statusElem.className = 'val';
  }

  // 烟气流动步进
  for (let i = 0; i < smokeParticles.length; i++) {
    const p = smokeParticles[i];
    const flow = getFlowVelocity(p.x, p.y);

    p.vx = flow.vx;
    p.vy = flow.vy;

    p.x += p.vx * 3.6;
    p.y += p.vy * 3.6;

    // 若撞入翼型实体内部，立即推向外表面沿线滑移
    if (isPointInsideAirfoil(p.x, p.y)) {
      p.x -= p.vx * 2;
      p.y += (p.y > center.y ? 3 : -3);
    }

    // 穿出右边界或上下边界时，重新从左侧风洞入口注入
    if (p.x > width + 20 || p.y < -20 || p.y > height + 20) {
      p.x = -10 - Math.random() * 80;
      p.y = Math.random() * height;
    }
  }

  // 用户鼠标涂抹烟雾注入
  if (state.userMouse.active) {
    for (let k = 0; k < 6; k++) {
      const idx = Math.floor(Math.random() * smokeParticles.length);
      smokeParticles[idx].x = state.userMouse.x + (Math.random() - 0.5) * 20;
      smokeParticles[idx].y = state.userMouse.y + (Math.random() - 0.5) * 20;
    }
  }
}

// 渲染主函数
function render() {
  ctx.fillStyle = '#030712';
  ctx.fillRect(0, 0, width, height);

  // 1. 绘制风洞流线背景网格
  drawTunnelGrid();

  // 2. 绘制伯努利压强等值场云光
  if (state.showPressure) {
    drawPressureField();
  }

  // 3. 绘制流动烟线
  drawSmokeTrails();

  // 4. 绘制中心翼型实体与表面边界层
  drawAirfoil();

  // 5. 绘制气动力矢量线 (升力 L、阻力 D、合力 R)
  if (state.showVectors) {
    drawAeroForces();
  }

  // FPS
  frames++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    document.getElementById('fps-val').textContent = frames + ' FPS';
    frames = 0;
    lastFpsTime = now;
  }
}

// 绘制风洞标尺网格
function drawTunnelGrid() {
  ctx.save();
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.05)';
  ctx.lineWidth = 1;

  const gridSize = 40;
  for (let x = 0; x < width; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
    ctx.stroke();
  }
  for (let y = 0; y < height; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }

  // 风洞壁面导流板装饰
  ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
  ctx.fillRect(0, 0, width, 6);
  ctx.fillRect(0, height - 6, width, 6);

  ctx.restore();
}

// 绘制流线烟雾
function drawSmokeTrails() {
  ctx.save();

  for (let i = 0; i < smokeParticles.length; i++) {
    const p = smokeParticles[i];
    const flow = getFlowVelocity(p.x, p.y);

    let color = 'rgba(56, 189, 248, 0.35)';
    if (state.colorScheme === 'aurora') {
      const hue = (p.streamId * 45 + (flow.speed * 20)) % 360;
      color = `hsla(${hue}, 85%, 65%, 0.4)`;
    } else if (state.colorScheme === 'thermal') {
      const t = Math.min(1.0, flow.speed / 8.0);
      color = `rgba(${Math.floor(t * 255)}, ${Math.floor((1 - t) * 180)}, 255, 0.4)`;
    }

    ctx.fillStyle = color;
    // 带有速度拉伸感的微流线
    const len = Math.max(2.5, flow.speed * 1.6);
    ctx.fillRect(p.x, p.y, len, 1.4);
  }

  ctx.restore();
}

// 绘制伯努利气压热力云图
function drawPressureField() {
  const center = getWingCenter();
  const aoaDeg = state.aoa * 180 / Math.PI;

  ctx.save();
  // 上表面吸力负压区 (低压天蓝晕)
  const topGrad = ctx.createRadialGradient(
    center.x, center.y - 45, 10,
    center.x, center.y - 45, 160
  );
  topGrad.addColorStop(0, 'rgba(56, 189, 248, 0.16)');
  topGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = topGrad;
  ctx.beginPath();
  ctx.arc(center.x, center.y - 45, 160, 0, Math.PI * 2);
  ctx.fill();

  // 下表面驻点高压区 (正压微红晕)
  const botGrad = ctx.createRadialGradient(
    center.x, center.y + 40, 5,
    center.x, center.y + 40, 120
  );
  botGrad.addColorStop(0, 'rgba(239, 68, 68, 0.12)');
  botGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = botGrad;
  ctx.beginPath();
  ctx.arc(center.x, center.y + 40, 120, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// 绘制翼型模型
function drawAirfoil() {
  const center = getWingCenter();

  ctx.save();
  ctx.translate(center.x, center.y);
  ctx.rotate(state.aoa);

  // 翼型主体
  ctx.beginPath();

  if (currentAirfoil.type === 'circle') {
    ctx.arc(0, 0, currentAirfoil.r * wingScale, 0, Math.PI * 2);
  } else if (currentAirfoil.type === 'plate') {
    const w = wingScale;
    const h = currentAirfoil.t * wingScale * 2;
    ctx.rect(-0.25 * w, -h / 2, w, h);
  } else {
    const pts = generateNacaPoints(currentAirfoil.m, currentAirfoil.p, currentAirfoil.t, 80);
    pts.forEach((pt, i) => {
      const sx = pt.x * wingScale;
      const sy = pt.y * wingScale;
      if (i === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    });
    ctx.closePath();
  }

  // 实体质感填充
  const wingGrad = ctx.createLinearGradient(-0.25 * wingScale, 0, 0.75 * wingScale, 0);
  wingGrad.addColorStop(0, '#334155');
  wingGrad.addColorStop(0.3, '#1e293b');
  wingGrad.addColorStop(1, '#0f172a');

  ctx.fillStyle = wingGrad;
  ctx.fill();

  // 表面边缘发光与弦长骨架
  ctx.strokeStyle = state.isDraggingWing ? '#38bdf8' : '#94a3b8';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#38bdf8';
  ctx.shadowBlur = state.isDraggingWing ? 16 : 4;
  ctx.stroke();

  // 1/4 气动焦点旋转轴心
  ctx.beginPath();
  ctx.arc(0, 0, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#ef4444';
  ctx.fill();

  ctx.restore();
}

// 绘制升力与阻力矢量线
function drawAeroForces() {
  const center = getWingCenter();
  const aoaDeg = state.aoa * 180 / Math.PI;
  const isStalled = Math.abs(aoaDeg) > 15.5;

  let cl = 2 * Math.PI * (state.aoa + (currentAirfoil.m ? currentAirfoil.m * 2 : 0));
  let cd = 0.015 + 1.2 * Math.sin(state.aoa) * Math.sin(state.aoa);

  if (isStalled) {
    cl = Math.sign(aoaDeg) * 0.45;
    cd = 0.55;
  }

  const forceScale = 90;

  // 1. 升力 Lift (垂直自由来流向上)
  const liftEndY = center.y - cl * forceScale;
  drawForceArrow(center.x, center.y, center.x, liftEndY, '#22c55e', `L (升力: ${cl.toFixed(2)})`);

  // 2. 阻力 Drag (顺着来流方向向右)
  const dragEndX = center.x + cd * forceScale * 1.5;
  drawForceArrow(center.x, center.y, dragEndX, center.y, '#ef4444', `D (阻力: ${cd.toFixed(2)})`);

  // 3. 总气动力合力 Resultant
  drawForceArrow(center.x, center.y, dragEndX, liftEndY, '#38bdf8', 'R (合力)');
}

function drawForceArrow(x1, y1, x2, y2, color, text) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2.5;

  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  const angle = Math.atan2(y2 - y1, x2 - x1);
  const headLen = 7;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();

  ctx.font = '11px monospace';
  ctx.fillText(text, x2 + 8, y2 + 4);
  ctx.restore();
}

// 鼠标交互控制迎角
let dragStartY = 0;
let initialAoa = 0;

canvas.addEventListener('mousedown', (e) => {
  const center = getWingCenter();
  const dist = Math.hypot(e.clientX - center.x, e.clientY - center.y);

  if (dist < wingScale * 0.8) {
    state.isDraggingWing = true;
    dragStartY = e.clientY;
    initialAoa = state.aoa;
  } else {
    state.userMouse.active = true;
    state.userMouse.x = e.clientX;
    state.userMouse.y = e.clientY;
  }
});

window.addEventListener('mousemove', (e) => {
  if (state.isDraggingWing) {
    const dy = e.clientY - dragStartY;
    // 向上拖增大迎角
    state.aoa = initialAoa - (dy * 0.006);
    state.aoa = Math.max(-25 * Math.PI / 180, Math.min(35 * Math.PI / 180, state.aoa));
    const deg = Math.round(state.aoa * 180 / Math.PI);
    document.getElementById('param-aoa').value = deg;
    document.getElementById('val-aoa').textContent = deg + '°';
  } else if (state.userMouse.active) {
    state.userMouse.x = e.clientX;
    state.userMouse.y = e.clientY;
  }
});

window.addEventListener('mouseup', () => {
  state.isDraggingWing = false;
  state.userMouse.active = false;
});

// UI 控制绑定
const paramAoa = document.getElementById('param-aoa');
paramAoa.addEventListener('input', (e) => {
  const deg = parseFloat(e.target.value);
  state.aoa = deg * Math.PI / 180;
  document.getElementById('val-aoa').textContent = deg + '°';
});

const paramSpeed = document.getElementById('param-speed');
paramSpeed.addEventListener('input', (e) => {
  state.windSpeed = parseFloat(e.target.value);
  document.getElementById('val-speed').textContent = state.windSpeed.toFixed(1);
});

const paramDensity = document.getElementById('param-density');
paramDensity.addEventListener('input', (e) => {
  state.smokeCount = parseInt(e.target.value);
  document.getElementById('val-density').textContent = state.smokeCount;
  resetSmoke();
});

// 按钮组
const btnVector = document.getElementById('btn-vector');
btnVector.addEventListener('click', () => {
  state.showVectors = !state.showVectors;
  btnVector.textContent = '📐 气动力矢量: ' + (state.showVectors ? '开' : '关');
  btnVector.classList.toggle('active', state.showVectors);
});

const btnPressure = document.getElementById('btn-pressure');
btnPressure.addEventListener('click', () => {
  state.showPressure = !state.showPressure;
  btnPressure.textContent = '🌈 伯努利压强场: ' + (state.showPressure ? '开' : '关');
  btnPressure.classList.toggle('active', state.showPressure);
});

const btnColor = document.getElementById('btn-color');
const schemes = [
  { id: 'aurora', name: '极光' },
  { id: 'cyan', name: '纯蓝' },
  { id: 'thermal', name: '热流' }
];
let colorIdx = 0;
btnColor.addEventListener('click', () => {
  colorIdx = (colorIdx + 1) % schemes.length;
  state.colorScheme = schemes[colorIdx].id;
  btnColor.textContent = '🎨 烟气色谱: ' + schemes[colorIdx].name;
});

document.getElementById('btn-reset').addEventListener('click', () => {
  state.aoa = 8 * Math.PI / 180;
  document.getElementById('param-aoa').value = 8;
  document.getElementById('val-aoa').textContent = '8°';
  resetSmoke();
});

// 仿真主循环
function loop(timestamp) {
  const dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;

  updateSimulation(dt);
  render();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
