<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全息量子陀螺与进动模拟器 - Quantum Gyroscope</title>
<style>
  :root {
    --bg-color: #030308;
    --accent-cyan: #00f3ff;
    --accent-magenta: #ff0077;
    --accent-gold: #ffb703;
    --glass-bg: rgba(10, 15, 30, 0.75);
    --glass-border: rgba(0, 243, 255, 0.25);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
  }

  body {
    background-color: var(--bg-color);
    color: #e2e8f0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  #viewport {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }

  #viewport:active {
    cursor: grabbing;
  }

  /* 顶部科幻抬头 */
  .header-badge {
    position: absolute;
    top: 24px;
    left: 28px;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .header-badge h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #00f3ff, #7000ff, #ff0077);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    text-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
  }

  .header-badge .sub {
    font-size: 0.85rem;
    color: #94a3b8;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-cyan);
    box-shadow: 0 0 10px var(--accent-cyan);
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* 浮动遥测数据面板 */
  .telemetry-card {
    position: absolute;
    top: 24px;
    right: 28px;
    z-index: 10;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 16px 20px;
    min-width: 260px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-family: 'Courier New', monospace;
  }

  .telemetry-title {
    font-size: 0.75rem;
    color: var(--accent-cyan);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    border-bottom: 1px solid rgba(0, 243, 255, 0.2);
    padding-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }

  .telemetry-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
  }

  .telemetry-row .label {
    color: #64748b;
  }

  .telemetry-row .val {
    color: #f1f5f9;
    font-weight: 600;
  }

  /* 底部控制台 */
  .control-dock {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 14px 24px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    gap: 20px;
    max-width: 90vw;
    flex-wrap: wrap;
    justify-content: center;
  }

  .dock-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .dock-group label {
    font-size: 0.72rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
  }

  .dock-group label span {
    color: var(--accent-cyan);
    font-family: monospace;
  }

  .dock-group input[type="range"] {
    -webkit-appearance: none;
    width: 130px;
    height: 4px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 2px;
    outline: none;
  }

  .dock-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent-cyan);
    cursor: pointer;
    box-shadow: 0 0 10px var(--accent-cyan);
    transition: transform 0.1s;
  }

  .dock-group input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.3);
  }

  .btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover {
    background: rgba(0, 243, 255, 0.2);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    transform: translateY(-2px);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn.active {
    background: var(--accent-cyan);
    color: #030308;
    border-color: var(--accent-cyan);
    box-shadow: 0 0 15px var(--accent-cyan);
  }

  /* 帮助提示 */
  .hint-box {
    position: absolute;
    bottom: 24px;
    left: 28px;
    z-index: 10;
    pointer-events: none;
    font-size: 0.75rem;
    color: #64748b;
    line-height: 1.6;
  }
</style>
</head>
<body>

<canvas id="viewport"></canvas>

<div class="header-badge">
  <h1>QUANTUM GYROSCOPE</h1>
  <div class="sub">
    <div class="status-dot"></div>
    <span>3D 刚体进动 · 章动混沌 · 全息涡流态</span>
  </div>
</div>

<div class="telemetry-card">
  <div class="telemetry-title">
    <span>遥测物理量 (PHYSICS)</span>
    <span id="fps-counter">60 FPS</span>
  </div>
  <div class="telemetry-row">
    <span class="label">自转角速度 ωs:</span>
    <span class="val" id="tele-spin">45.0 rad/s</span>
  </div>
  <div class="telemetry-row">
    <span class="label">进动周期 Tp:</span>
    <span class="val" id="tele-prec">3.14 s</span>
  </div>
  <div class="telemetry-row">
    <span class="label">倾斜倾角 θ:</span>
    <span class="val" id="tele-theta">38.5°</span>
  </div>
  <div class="telemetry-row">
    <span class="label">角动量 L:</span>
    <span class="val" id="tele-l">1.82 J·s</span>
  </div>
  <div class="telemetry-row">
    <span class="label">动态粒子数:</span>
    <span class="val" id="tele-particles">1200</span>
  </div>
</div>

<div class="hint-box">
  🖱️ 左键拖拽: 旋转 3D 视角<br>
  ⚙️ 滚轮: 推进 / 远离视图<br>
  🌌 空格键: 释放反重力量子脉冲
</div>

<div class="control-dock">
  <div class="dock-group">
    <label>自转转速 Spin <span id="val-spin">45</span></label>
    <input type="range" id="param-spin" min="5" max="100" value="45">
  </div>
  <div class="dock-group">
    <label>引力场 g <span id="val-gravity">9.8</span></label>
    <input type="range" id="param-gravity" min="0" max="25" step="0.5" value="9.8">
  </div>
  <div class="dock-group">
    <label>倾斜轴角 Tilt <span id="val-tilt">40°</span></label>
    <input type="range" id="param-tilt" min="10" max="80" value="40">
  </div>
  <div class="dock-group">
    <label>空气阻尼 Friction <span id="val-fric">0.05</span></label>
    <input type="range" id="param-fric" min="0" max="0.2" step="0.01" value="0.02">
  </div>

  <button class="btn" id="btn-impulse">⚡ 施加微扰</button>
  <button class="btn" id="btn-vectors">📐 矢量场: 开</button>
  <button class="btn" id="btn-sound">🔊 音频: 关</button>
  <button class="btn" id="btn-reset">🔄 重置姿态</button>
</div>

<script>
/**
 * 全息量子陀螺与进动模拟器
 * 核心数学引擎：3D 欧拉角运动学、角动量 L 守恒、力矩进动 Precession & Nutation
 */

const canvas = document.getElementById('viewport');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// 物理状态
const state = {
  spinSpeed: 45.0,     // 自转角速度 rad/s (ωs)
  targetSpin: 45.0,
  gravity: 9.8,        // 重力场
  tiltAngle: 40 * Math.PI / 180, // 初始倾角 θ (rad)
  friction: 0.02,

  // 动态欧拉角
  psi: 0,              // 自转角 (Spin)
  phi: 0,              // 进动角 (Precession)
  theta: 40 * Math.PI / 180, // 章动倾角 (Nutation)
  thetaVel: 0,         // 章动角速度

  // 物理常数模型
  mass: 0.8,           // 陀螺质量 kg
  radius: 1.2,         // 陀螺盘半径 m
  armLength: 1.8,      // 支点到质心距离
  I_spin: 0.5 * 0.8 * 1.2 * 1.2, // 转动惯量 1/2 m r^2
  showVectors: true,
  soundEnabled: false
};

// 交互与相机视角
const camera = {
  rotX: 0.35,
  rotY: 0.6,
  zoom: 1.0,
  isDragging: false,
  lastMouseX: 0,
  lastMouseY: 0
};

// 轨迹点与量子粒子
const trailPoints = [];
const MAX_TRAIL = 220;
const particles = [];
const MAX_PARTICLES = 1200;

for (let i = 0; i < MAX_PARTICLES; i++) {
  particles.push({
    angle: Math.random() * Math.PI * 2,
    radius: 0.4 + Math.random() * 1.8,
    yOffset: (Math.random() - 0.5) * 0.3,
    speed: (0.8 + Math.random() * 0.4),
    size: Math.random() * 2 + 1,
    color: Math.random() > 0.4 ? '#00f3ff' : (Math.random() > 0.5 ? '#ff0077' : '#ffb703')
  });
}

// 简易 Web Audio 物理微音效合成器
let audioCtx = null;
let humOsc = null;
let humGain = null;

function initAudio() {
  if (audioCtx) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();

    humOsc = audioCtx.createOscillator();
    humGain = audioCtx.createGain();

    humOsc.type = 'sawtooth';
    humOsc.frequency.setValueAtTime(120, audioCtx.currentTime);

    // 低通滤波减少尖刺
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(450, audioCtx.currentTime);

    humGain.gain.setValueAtTime(0.001, audioCtx.currentTime);

    humOsc.connect(filter);
    filter.connect(humGain);
    humGain.connect(audioCtx.destination);
    humOsc.start();
  } catch (e) {
    console.warn("Web Audio not supported", e);
  }
}

function updateAudio(spin) {
  if (!audioCtx || !state.soundEnabled) return;
  const targetFreq = Math.max(40, spin * 4.5);
  humOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
  humGain.gain.setTargetAtTime(0.035, audioCtx.currentTime, 0.1);
}

function stopAudio() {
  if (humGain && audioCtx) {
    humGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.05);
  }
}

function triggerImpulseSound() {
  if (!audioCtx || !state.soundEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.35);
}

// 3D 数学辅助函数
function project3D(x, y, z) {
  // 绕 Y 轴旋转
  const cosY = Math.cos(camera.rotY);
  const sinY = Math.sin(camera.rotY);
  const x1 = x * cosY - z * sinY;
  const z1 = z * cosY + x * sinY;

  // 绕 X 轴旋转
  const cosX = Math.cos(camera.rotX);
  const sinX = Math.sin(camera.rotX);
  const y2 = y * cosX - z1 * sinX;
  const z2 = z1 * cosX + y * sinX;

  // 透视投影
  const fov = 650 * camera.zoom;
  const distance = 8.5;
  const scale = fov / (z2 + distance);

  return {
    x: width / 2 + x1 * scale,
    y: height / 2 - y2 * scale,
    scale: scale,
    zDepth: z2
  };
}

// 矩阵变换计算陀螺轴向单位向量
function getGyroAxes() {
  // 轴向量经过进动角 phi 和倾斜角 theta
  const sinPhi = Math.sin(state.phi);
  const cosPhi = Math.cos(state.phi);
  const sinTheta = Math.sin(state.theta);
  const cosTheta = Math.cos(state.theta);

  // 主轴向 n (从支点指向盘中心)
  const nx = sinTheta * cosPhi;
  const ny = cosTheta;
  const nz = sinTheta * sinPhi;

  // 垂直盘平面的两个正交径向基底
  const u = {
    x: -sinPhi,
    y: 0,
    z: cosPhi
  };
  const v = {
    x: -cosTheta * cosPhi,
    y: sinTheta,
    z: -cosTheta * sinPhi
  };

  return { n: { x: nx, y: ny, z: nz }, u, v };
}

// 物理主循环更新
let lastTime = performance.now();
let frameCount = 0;
let lastFpsTime = performance.now();

function updatePhysics(dt) {
  // 限制过大步长
  dt = Math.min(dt, 0.05);

  // 阻尼让自转缓慢回归目标设定值
  state.spinSpeed += (state.targetSpin - state.spinSpeed) * 0.05;
  state.spinSpeed = Math.max(0.1, state.spinSpeed - state.friction * dt * 0.5);

  // 欧拉运动方程求解
  // 力矩 Tau = r × mg = armLength * mass * gravity * sin(theta)
  const torque = state.armLength * state.mass * state.gravity * Math.sin(state.theta);

  // 角动量 L = I_spin * spinSpeed
  const L = Math.max(0.01, state.I_spin * state.spinSpeed);

  // 经典陀螺进动角速度 Omega_p = Torque / (L * sin(theta)) = (m g r) / (I * ωs)
  const precRate = (state.armLength * state.mass * state.gravity) / (L + 0.0001);

  // 进动角度累加
  state.phi += precRate * dt;

  // 章动动力学（次级谐振摆动）：theta 围绕平衡角轻微振荡
  const nutationRest = state.tiltAngle;
  const nutationFreq = L / (state.mass * state.radius * state.radius + 0.1);
  const nutationTorque = -nutationFreq * nutationFreq * (state.theta - nutationRest) * 0.02;
  state.thetaVel += (nutationTorque - state.thetaVel * 2.0) * dt;
  state.theta += state.thetaVel * dt;

  // 自转角度累加
  state.psi += state.spinSpeed * dt;

  // 更新顶部轨迹记录
  const axes = getGyroAxes();
  const topX = axes.n.x * (state.armLength * 1.5);
  const topY = axes.n.y * (state.armLength * 1.5);
  const topZ = axes.n.z * (state.armLength * 1.5);

  trailPoints.push({ x: topX, y: topY, z: topZ, life: 1.0 });
  if (trailPoints.length > MAX_TRAIL) {
    trailPoints.shift();
  }

  // 衰减轨迹寿命
  for (let i = 0; i < trailPoints.length; i++) {
    trailPoints[i].life = (i / trailPoints.length);
  }

  // 遥测数据刷新
  document.getElementById('tele-spin').textContent = state.spinSpeed.toFixed(1) + ' rad/s';
  const tp = (2 * Math.PI / Math.max(0.001, precRate));
  document.getElementById('tele-prec').textContent = tp > 99 ? '∞' : tp.toFixed(2) + ' s';
  document.getElementById('tele-theta').textContent = (state.theta * 180 / Math.PI).toFixed(1) + '°';
  document.getElementById('tele-l').textContent = (L).toFixed(2) + ' J·s';

  updateAudio(state.spinSpeed);
}

// 渲染主函数
function render() {
  ctx.clearRect(0, 0, width, height);

  // 绘制深空能量网格地面
  drawGroundGrid();

  const axes = getGyroAxes();
  const centerPos = {
    x: axes.n.x * state.armLength,
    y: axes.n.y * state.armLength,
    z: axes.n.z * state.armLength
  };

  // 绘制进动轨迹云彩带
  drawTrail();

  // 绘制支点座
  drawBaseStand();

  // 绘制主转轴
  drawShaft(axes);

  // 绘制量子飞轮圆环
  drawFlywheel(axes, centerPos);

  // 绘制围绕飞轮的量子云粒子
  drawQuantumParticles(axes, centerPos);

  // 绘制物理学向量线 (角动量 L, 重力力矩 Tau, 进动速度 Omega)
  if (state.showVectors) {
    drawVectors(axes, centerPos);
  }

  // FPS 计算
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    document.getElementById('fps-counter').textContent = frameCount + ' FPS';
    frameCount = 0;
    lastFpsTime = now;
  }
}

// 绘制地基能量网格
function drawGroundGrid() {
  const gridSize = 12;
  const step = 0.8;
  ctx.lineWidth = 1;

  for (let i = -gridSize; i <= gridSize; i++) {
    const p1 = project3D(i * step, 0, -gridSize * step);
    const p2 = project3D(i * step, 0, gridSize * step);

    const distAlpha = Math.max(0, 1 - Math.abs(i) / gridSize);
    ctx.strokeStyle = `rgba(0, 243, 255, ${distAlpha * 0.08})`;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();

    const p3 = project3D(-gridSize * step, 0, i * step);
    const p4 = project3D(gridSize * step, 0, i * step);
    ctx.beginPath();
    ctx.moveTo(p3.x, p3.y);
    ctx.lineTo(p4.x, p4.y);
    ctx.stroke();
  }

  // 进动投影光环 (地面影迹)
  ctx.beginPath();
  const groundCenter = project3D(0, 0, 0);
  const ringRadius = Math.sin(state.theta) * state.armLength * 1.5;
  const segments = 60;
  for (let i = 0; i <= segments; i++) {
    const ang = (i / segments) * Math.PI * 2;
    const px = Math.cos(ang) * ringRadius;
    const pz = Math.sin(ang) * ringRadius;
    const p = project3D(px, 0.01, pz);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(255, 0, 119, 0.25)';
  ctx.setLineDash([4, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
}

// 绘制进动轨迹带
function drawTrail() {
  if (trailPoints.length < 2) return;

  for (let i = 1; i < trailPoints.length; i++) {
    const pt1 = trailPoints[i - 1];
    const pt2 = trailPoints[i];

    const p1 = project3D(pt1.x, pt1.y, pt1.z);
    const p2 = project3D(pt2.x, pt2.y, pt2.z);

    const alpha = pt2.life * 0.75;
    ctx.strokeStyle = `rgba(255, 0, 119, ${alpha})`;
    ctx.lineWidth = pt2.life * 2.5 + 0.5;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }
}

// 绘制支点基座
function drawBaseStand() {
  const pOrigin = project3D(0, 0, 0);
  const pTip = project3D(0, 0.1, 0);

  // 发光底座光环
  ctx.save();
  ctx.beginPath();
  const rProj = project3D(0.4, 0, 0);
  const radius = Math.abs(rProj.x - pOrigin.x);
  ctx.arc(pOrigin.x, pOrigin.y, radius, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0, 243, 255, 0.4)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 尖峰支承点
  ctx.beginPath();
  ctx.arc(pTip.x, pTip.y, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#00f3ff';
  ctx.shadowColor = '#00f3ff';
  ctx.shadowBlur = 12;
  ctx.fill();
  ctx.restore();
}

// 绘制主轴杆
function drawShaft(axes) {
  const pBottom = project3D(0, 0, 0);
  const topLength = state.armLength * 1.5;
  const pTop = project3D(axes.n.x * topLength, axes.n.y * topLength, axes.n.z * topLength);

  ctx.save();
  const grad = ctx.createLinearGradient(pBottom.x, pBottom.y, pTop.x, pTop.y);
  grad.addColorStop(0, '#00f3ff');
  grad.addColorStop(0.5, '#ffffff');
  grad.addColorStop(1, '#ff0077');

  ctx.beginPath();
  ctx.moveTo(pBottom.x, pBottom.y);
  ctx.lineTo(pTop.x, pTop.y);
  ctx.strokeStyle = grad;
  ctx.lineWidth = 3.5;
  ctx.shadowColor = 'rgba(0, 243, 255, 0.5)';
  ctx.shadowBlur = 8;
  ctx.stroke();
  ctx.restore();
}

// 绘制飞轮盘体
function drawFlywheel(axes, center) {
  const segments = 48;
  const r = state.radius;

  // 轮盘发光外圈
  ctx.save();
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0, 243, 255, 0.85)';
  ctx.shadowColor = '#00f3ff';
  ctx.shadowBlur = 16;
  ctx.beginPath();

  const discPoints = [];
  for (let i = 0; i <= segments; i++) {
    const angle = (i / segments) * Math.PI * 2 + state.psi;
    const cosA = Math.cos(angle);
    const sinA = Math.sin(angle);

    const px = center.x + (axes.u.x * cosA + axes.v.x * sinA) * r;
    const py = center.y + (axes.u.y * cosA + axes.v.y * sinA) * r;
    const pz = center.z + (axes.u.z * cosA + axes.v.z * sinA) * r;

    const p = project3D(px, py, pz);
    discPoints.push(p);

    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();

  // 内部透明发光质感
  ctx.fillStyle = 'rgba(0, 243, 255, 0.06)';
  ctx.fill();

  // 绘制 4 根轮辐辐条 (随自转角度 psi 高速转动)
  ctx.lineWidth = 1.8;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
  const centerProj = project3D(center.x, center.y, center.z);

  for (let s = 0; s < 4; s++) {
    const angle = state.psi + (s * Math.PI / 2);
    const cosA = Math.cos(angle);
    const sinA = Math.sin(angle);

    const px = center.x + (axes.u.x * cosA + axes.v.x * sinA) * r;
    const py = center.y + (axes.u.y * cosA + axes.v.y * sinA) * r;
    const pz = center.z + (axes.u.z * cosA + axes.v.z * sinA) * r;

    const rimProj = project3D(px, py, pz);
    ctx.beginPath();
    ctx.moveTo(centerProj.x, centerProj.y);
    ctx.lineTo(rimProj.x, rimProj.y);
    ctx.stroke();

    // 轮缘发光质点
    ctx.beginPath();
    ctx.arc(rimProj.x, rimProj.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#ff0077';
    ctx.fill();
  }
  ctx.restore();
}

// 绘制量子纠缠环绕粒子
function drawQuantumParticles(axes, center) {
  ctx.save();
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.angle += (state.spinSpeed * 0.05 * p.speed) * 0.016;

    const cosA = Math.cos(p.angle);
    const sinA = Math.sin(p.angle);

    const px = center.x + (axes.u.x * cosA + axes.v.x * sinA) * p.radius + axes.n.x * p.yOffset;
    const py = center.y + (axes.u.y * cosA + axes.v.y * sinA) * p.radius + axes.n.y * p.yOffset;
    const pz = center.z + (axes.u.z * cosA + axes.v.z * sinA) * p.radius + axes.n.z * p.yOffset;

    const proj = project3D(px, py, pz);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, p.size * (proj.scale / 100), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// 绘制 3D 物理矢量场指示器
function drawVectors(axes, center) {
  const pCenter = project3D(center.x, center.y, center.z);

  // 1. 角动量矢量 L (沿转轴主干)
  const lLen = 1.4;
  const pL = project3D(
    center.x + axes.n.x * lLen,
    center.y + axes.n.y * lLen,
    center.z + axes.n.z * lLen
  );
  drawArrow(pCenter, pL, '#00f3ff', 'L (角动量)');

  // 2. 引力力矩矢量 Tau = r × Fg (垂直于转轴与竖直重力平面)
  const tauLen = 1.1;
  const pTau = project3D(
    center.x + axes.u.x * tauLen,
    center.y + axes.u.y * tauLen,
    center.z + axes.u.z * tauLen
  );
  drawArrow(pCenter, pTau, '#ff0077', 'τ (重力力矩)');

  // 3. 支点垂直中轴参考线
  const pVertical = project3D(0, 3.0, 0);
  const pOrigin = project3D(0, 0, 0);
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
  ctx.setLineDash([3, 5]);
  ctx.beginPath();
  ctx.moveTo(pOrigin.x, pOrigin.y);
  ctx.lineTo(pVertical.x, pVertical.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawArrow(p1, p2, color, label) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2.5;

  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.stroke();

  // 箭头头部
  const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
  const headLen = 8;
  ctx.beginPath();
  ctx.moveTo(p2.x, p2.y);
  ctx.lineTo(p2.x - headLen * Math.cos(angle - Math.PI / 6), p2.y - headLen * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(p2.x - headLen * Math.cos(angle + Math.PI / 6), p2.y - headLen * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();

  // 标签
  ctx.font = '11px monospace';
  ctx.fillText(label, p2.x + 8, p2.y + 4);
  ctx.restore();
}

// 交互事件监听
canvas.addEventListener('mousedown', (e) => {
  camera.isDragging = true;
  camera.lastMouseX = e.clientX;
  camera.lastMouseY = e.clientY;
});

window.addEventListener('mouseup', () => {
  camera.isDragging = false;
});

window.addEventListener('mousemove', (e) => {
  if (!camera.isDragging) return;
  const dx = e.clientX - camera.lastMouseX;
  const dy = e.clientY - camera.lastMouseY;

  camera.rotY += dx * 0.006;
  camera.rotX = Math.max(-1.1, Math.min(1.1, camera.rotX - dy * 0.006));

  camera.lastMouseX = e.clientX;
  camera.lastMouseY = e.clientY;
});

// 滚轮缩放
window.addEventListener('wheel', (e) => {
  camera.zoom = Math.max(0.4, Math.min(2.5, camera.zoom - e.deltaY * 0.001));
}, { passive: true });

// 触摸支持
let lastTouchX = 0, lastTouchY = 0;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    camera.isDragging = true;
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
  }
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  if (camera.isDragging && e.touches.length === 1) {
    const dx = e.touches[0].clientX - lastTouchX;
    const dy = e.touches[0].clientY - lastTouchY;
    camera.rotY += dx * 0.007;
    camera.rotX = Math.max(-1.1, Math.min(1.1, camera.rotX - dy * 0.007));
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
  }
}, { passive: true });

window.addEventListener('touchend', () => {
  camera.isDragging = false;
});

// UI 控制绑定
const paramSpin = document.getElementById('param-spin');
const valSpin = document.getElementById('val-spin');
paramSpin.addEventListener('input', (e) => {
  state.targetSpin = parseFloat(e.target.value);
  valSpin.textContent = state.targetSpin;
});

const paramGravity = document.getElementById('param-gravity');
const valGravity = document.getElementById('val-gravity');
paramGravity.addEventListener('input', (e) => {
  state.gravity = parseFloat(e.target.value);
  valGravity.textContent = state.gravity.toFixed(1);
});

const paramTilt = document.getElementById('param-tilt');
const valTilt = document.getElementById('val-tilt');
paramTilt.addEventListener('input', (e) => {
  const deg = parseFloat(e.target.value);
  state.tiltAngle = deg * Math.PI / 180;
  state.theta = state.tiltAngle;
  valTilt.textContent = deg + '°';
});

const paramFric = document.getElementById('param-fric');
const valFric = document.getElementById('val-fric');
paramFric.addEventListener('input', (e) => {
  state.friction = parseFloat(e.target.value);
  valFric.textContent = state.friction.toFixed(2);
});

// 施加微扰撞击
function applyImpulse() {
  state.thetaVel += (Math.random() - 0.5) * 3.5;
  state.spinSpeed = Math.max(5, state.spinSpeed + (Math.random() - 0.5) * 10);
  triggerImpulseSound();

  // 爆发量子喷射
  for (let i = 0; i < 40; i++) {
    particles.push({
      angle: Math.random() * Math.PI * 2,
      radius: state.radius + Math.random() * 0.5,
      yOffset: (Math.random() - 0.5) * 1.5,
      speed: 2.5 + Math.random() * 2,
      size: Math.random() * 3 + 1,
      color: '#ff0077'
    });
  }
  if (particles.length > MAX_PARTICLES + 100) {
    particles.splice(0, 40);
  }
}
document.getElementById('btn-impulse').addEventListener('click', applyImpulse);

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    applyImpulse();
  }
});

// 矢量场开关
const btnVectors = document.getElementById('btn-vectors');
btnVectors.addEventListener('click', () => {
  state.showVectors = !state.showVectors;
  btnVectors.textContent = '📐 矢量场: ' + (state.showVectors ? '开' : '关');
  btnVectors.classList.toggle('active', state.showVectors);
});

// 音频开关
const btnSound = document.getElementById('btn-sound');
btnSound.addEventListener('click', () => {
  initAudio();
  state.soundEnabled = !state.soundEnabled;
  btnSound.textContent = '🔊 音频: ' + (state.soundEnabled ? '开' : '关');
  btnSound.classList.toggle('active', state.soundEnabled);
  if (!state.soundEnabled) stopAudio();
});

// 重置姿态
document.getElementById('btn-reset').addEventListener('click', () => {
  state.theta = state.tiltAngle;
  state.thetaVel = 0;
  state.phi = 0;
  trailPoints.length = 0;
});

// 运行动画循环
function loop(timestamp) {
  const dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;

  updatePhysics(dt);
  render();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
